name: Daily Slips

on:
  schedule:
    - cron: "0 17 * * *"    # 17:00 UTC = 20:00 Kampala -> one message, both sports
  workflow_dispatch:         # manual run from the Actions tab
    inputs:
      sport:
        description: "What to send"
        type: choice
        options:
          - both
          - football
          - basketball
        default: both

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send slips
        run: python daily_slip.py ${{ github.event.inputs.sport }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save history
        run: |
          git config user.name "slip-bot"
          git config user.email "slip-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Update history" && git pull --rebase && git push)
