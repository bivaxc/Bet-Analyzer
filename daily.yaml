name: Daily Slips

on:
  schedule:
    - cron: "20 6 * * *"    # 06:20 UTC = 09:20 Kampala -> football slip
    - cron: "20 13 * * *"   # 13:20 UTC = 16:20 Kampala -> basketball slip
  workflow_dispatch:         # manual run from the Actions tab
    inputs:
      sport:
        description: "Which slip to send"
        type: choice
        options:
          - football
          - basketball
        default: football

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose sport
        id: sport
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.sport }}"
          elif [ "${{ github.event.schedule }}" = "20 13 * * *" ]; then
            S="basketball"
          else
            S="football"
          fi
          echo "sport=$S" >> "$GITHUB_OUTPUT"

      - name: Build and send slip
        run: python daily_slip.py ${{ steps.sport.outputs.sport }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save history
        run: |
          git config user.name "slip-bot"
          git config user.email "slip-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Update history" && git pull --rebase && git push)
